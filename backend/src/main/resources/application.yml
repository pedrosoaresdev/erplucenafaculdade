spring:
  application:
    name: erp-universitario
  datasource:
    url: ${ERP_DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${ERP_DB_USER:erp}
    password: ${ERP_DB_PASSWORD:erp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 25MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

erp:
  security:
    # Obrigatórias em produção (Base64). Gere com: openssl rand -base64 32
    jwt-secret: ${ERP_JWT_SECRET}
    encryption-key: ${ERP_ENCRYPTION_KEY}
    access-token-ttl: 15m
    refresh-token-ttl: 12h
    challenge-ttl: 5m
    step-up-ttl: 5m
    totp-issuer: ${ERP_TOTP_ISSUER:ERP Lucena}
    cookie-secure: ${ERP_COOKIE_SECURE:true}
    max-failed-logins: 5
    lockout-duration: 15m
    max-challenge-attempts: 5
    auth-requests-per-minute: ${ERP_AUTH_RATE_LIMIT:30}
    recovery-code-count: 10
    breached-password-check: ${ERP_BREACHED_PASSWORD_CHECK:false}
  bootstrap:
    master-username: ${ERP_BOOTSTRAP_MASTER_USERNAME:}
    master-password: ${ERP_BOOTSTRAP_MASTER_PASSWORD:}
    master-email: ${ERP_BOOTSTRAP_MASTER_EMAIL:}
    master-name: ${ERP_BOOTSTRAP_MASTER_NAME:Administrador Master}
  setup:
    owner-email: ${ERP_OWNER_EMAIL:}
  cors:
    allowed-origins: ${ERP_CORS_ORIGINS:http://localhost:4200}
